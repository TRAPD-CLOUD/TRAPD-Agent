[package]
name = "trapd-telemetry-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
chrono = "0.4"
regex = "1"
hex = "0.4"
sha2 = "0.10"
libfuzzer-sys = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trapd-schema = { path = "../crates/trapd-schema" }

[[bin]]
name = "log_fields"
path = "fuzz_targets/log_fields.rs"
test = false
doc = false
bench = false

[[bin]]
name = "queue_roundtrip"
path = "fuzz_targets/queue_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proc_fields"
path = "fuzz_targets/proc_fields.rs"
test = false
doc = false
bench = false

[[bin]]
name = "etw_connection"
path = "fuzz_targets/etw_connection.rs"
test = false
doc = false
bench = false
