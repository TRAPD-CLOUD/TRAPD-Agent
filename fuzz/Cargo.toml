[package]
name = "trapd-telemetry-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
hex = "0.4"
sha2 = "0.10"
libfuzzer-sys = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trapd-schema = { path = "../crates/trapd-schema" }
trapd-detection = { path = "../crates/trapd-detection" }
anyhow = "1"
async-trait = "0.1"
libc = "0.2"
md-5 = "0.10"
tokio = { version = "1", features = ["net", "sync", "rt", "macros", "time"] }
base64 = "0.22"
ed25519-dalek = "2"
globset = "0.4"
ipnet = { version = "2", features = ["serde"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
roxmltree = "0.20"

[[bin]]
name = "log_fields"
path = "fuzz_targets/log_fields.rs"
test = false
doc = false
bench = false

[[bin]]
name = "queue_roundtrip"
path = "fuzz_targets/queue_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proc_fields"
path = "fuzz_targets/proc_fields.rs"
test = false
doc = false
bench = false

[[bin]]
name = "etw_connection"
path = "fuzz_targets/etw_connection.rs"
test = false
doc = false
bench = false

[[bin]]
name = "journal_json"
path = "fuzz_targets/journal_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "eventlog_xml"
path = "fuzz_targets/eventlog_xml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "signed_command"
path = "fuzz_targets/signed_command.rs"
test = false
doc = false
bench = false

[[bin]]
name = "packet_frames"
path = "fuzz_targets/packet_frames.rs"
test = false
doc = false
bench = false
