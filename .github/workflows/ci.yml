name: CI
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --manifest-path agent/Cargo.toml
      - run: cargo clippy --manifest-path agent/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path agent/Cargo.toml

      # Telemetry-pipeline acceptance gate. The unit and integration suites
      # above already cover the loss-transparency contract (stable event ids,
      # journal checksums, torn-tail vs. corruption, partial/duplicate
      # acknowledgement, drop attribution, parser fuzzing), so a regression
      # there fails the build. This step additionally runs the *load* tests,
      # which are `#[ignore]`d by default because they take minutes.
      #
      # Only the bounded ones run here: the 60-second and soak profiles are
      # throughput-sensitive and would be flaky on a shared runner, so they
      # belong on a reference machine rather than in the PR gate.
      - name: Telemetry pipeline acceptance tests
        run: |
          cargo test --release --manifest-path agent/Cargo.toml \
            --test telemetry_load -- --ignored --nocapture --test-threads=1 \
            every_record_in_a_large_journal_validates \
            large_command_lines_do_not_break_framing

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: trapd-agent-linux-x86_64
          path: target/release/trapd-agent

  # Windows agent — cross-compiled from Linux with the mingw-w64 toolchain
  # (the same recipe the release workflow uses), so a change that breaks the
  # Windows build is caught on every push/PR, not at tag time.
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install mingw-w64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
      - run: cargo build --release --target x86_64-pc-windows-gnu --manifest-path agent/Cargo.toml
      - run: cargo clippy --release --target x86_64-pc-windows-gnu --manifest-path agent/Cargo.toml -- -D warnings
      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: trapd-agent-windows-x86_64.exe
          path: target/x86_64-pc-windows-gnu/release/trapd-agent.exe

  # The kernel-side detection lives entirely in the trapd-agent-ebpf crate,
  # which is a SEPARATE workspace built with a pinned nightly + bpf-linker for
  # the bpfel-unknown-none target (see xtask/src/main.rs). The `build` job above
  # never touches it, so a change that breaks an eBPF program (compile error,
  # bad map/struct layout, invalid verifier construct) would otherwise sail
  # through CI green and only surface at release/load time. This job compiles
  # the eBPF crate on every push/PR so such breakage is caught and blocking.
  ebpf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # The eBPF crate pins its own nightly (+ rust-src component) via
      # trapd-agent-ebpf/rust-toolchain.toml. Touching the crate dir makes
      # rustup auto-install that toolchain up front, so the download cost is
      # paid before the build step and rust-cache can pick it up.
      - name: Install pinned nightly toolchain + rust-src (eBPF build)
        working-directory: trapd-agent-ebpf
        run: |
          rustup show active-toolchain
          rustc --version

      - uses: Swatinem/rust-cache@v2

      # bpf-linker links against a specific host LLVM when built from source.
      # GitHub runners do not provide a matching llvm-config, so use the
      # upstream-recommended prebuilt binary path instead of `cargo install`.
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.21.1
      - name: Install prebuilt bpf-linker
        run: cargo binstall --no-confirm --version 0.11.0 bpf-linker

      # Blocking: a verifier/compile failure in any eBPF program fails the PR.
      - name: Build eBPF programs (release)
        run: cargo xtask build-ebpf --release
