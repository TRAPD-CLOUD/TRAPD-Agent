name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Needed by the SignPath action (windows-package.yml) to read the uploaded
  # unsigned artifact. A called workflow cannot hold more than its caller.
  actions: read

jobs:
  windows-msi:
    uses: ./.github/workflows/windows-package.yml
    # Passes SIGNPATH_API_TOKEN (optional) to the called workflow.
    secrets: inherit

  release:
    needs: windows-msi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches agent version
        # The signed release statement carries the version the agent compares
        # against its own, so a tag that disagrees with Cargo.toml would produce
        # a release that is mis-ordered (or never offered) by the update logic.
        run: |
          crate_version="$(grep -m1 '^version' agent/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          if [ "v${crate_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match agent/Cargo.toml version v${crate_version}"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      # The eBPF crate pins its own nightly via trapd-agent-ebpf/rust-toolchain.toml.
      # Trigger rustup to install it (with the rust-src component) up front so the
      # download cost is paid before the build step and so rust-cache picks it up.
      - name: Install pinned nightly toolchain + rust-src (eBPF build)
        working-directory: trapd-agent-ebpf
        run: |
          rustup show active-toolchain
          rustc --version

      - uses: Swatinem/rust-cache@v2

      # Use the upstream release binary. Building bpf-linker via `cargo
      # install` requires a matching host LLVM/llvm-config and is explicitly
      # discouraged by the project.
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.21.1
      - name: Install prebuilt bpf-linker
        run: cargo binstall --no-confirm --version 0.11.0 bpf-linker

      - name: Build agent (release)
        run: cargo build --release --manifest-path agent/Cargo.toml

      - name: Build eBPF binary (release)
        run: cargo xtask build-ebpf --release

      - name: Install SBOM + audit tooling
        run: |
          cargo install cargo-cyclonedx --locked
          cargo install cargo-audit --locked

      - name: Generate SBOM (CycloneDX) for agent + eBPF crate
        run: |
          # CycloneDX SBOM for the shipped userspace binary (agent workspace;
          # xtask shares the lockfile but is a build-only helper). cargo-cyclonedx
          # writes <pkg>.cdx.json next to the manifest, so locate it by name
          # (robust to the exact output directory across tool versions).
          cargo cyclonedx --manifest-path agent/Cargo.toml --format json
          mv "$(find . -path ./target -prune -o -name 'trapd-agent.cdx.json' -print | head -n1)" \
             sbom-trapd-agent.cdx.json
          # CycloneDX SBOM for the kernel-side eBPF crate (separate workspace
          # and toolchain) — so the SBOM set covers BOTH shipped artefacts.
          cargo cyclonedx --manifest-path trapd-agent-ebpf/Cargo.toml --format json
          mv "$(find . -path ./target -prune -o -name 'trapd-agent-ebpf.cdx.json' -print | head -n1)" \
             sbom-trapd-agent-ebpf.cdx.json
          ls -l sbom-trapd-agent.cdx.json sbom-trapd-agent-ebpf.cdx.json

      - name: Dependency vulnerability scan (cargo audit)
        # Non-blocking: a freshly disclosed CVE should not silently block a
        # release, but it is recorded in the release logs for triage. Scans
        # both lockfiles (agent workspace + eBPF crate).
        continue-on-error: true
        run: |
          cargo audit --file Cargo.lock
          cargo audit --file trapd-agent-ebpf/Cargo.lock

      - name: Download verified native Windows assets
        uses: actions/download-artifact@v4
        with:
          name: trapd-windows-release
          path: .

      - name: Stage release assets
        run: |
          cp target/release/trapd-agent trapd-agent-linux-x86_64
          # The eBPF crate redirects its target-dir to ../target (root) via
          # trapd-agent-ebpf/.cargo/config.toml, so the artifact lands here:
          cp target/bpfel-unknown-none/release/trapd-agent-exec trapd-agent-exec
          # Published as its own release asset (not generated inline by
          # install.sh) so trapd-update's self-refresh step can fetch and
          # verify the current version of itself on every run — see the
          # comment at the top of deploy/trapd-update.sh.
          cp deploy/trapd-update.sh trapd-update.sh

      # Debian package with the hosted service's PUBLIC trust anchors baked in,
      # so a double-click / `apt install ./x.deb` install pairs without any
      # configuration. Values come from repository variables (never secrets) and
      # go through env, not into the script text. Without all five variables no
      # package is built; the web installer remains the way to install.
      - name: Build Debian package (hosted trust anchors)
        id: deb
        env:
          TRAPD_HOSTED_BACKEND_URL: ${{ vars.TRAPD_HOSTED_BACKEND_URL }}
          TRAPD_HOSTED_CA_PEM: ${{ vars.TRAPD_HOSTED_CA_PEM }}
          TRAPD_HOSTED_COMMAND_PUBKEY: ${{ vars.TRAPD_HOSTED_COMMAND_PUBKEY }}
          TRAPD_HOSTED_RELEASE_PUBKEY: ${{ vars.TRAPD_HOSTED_RELEASE_PUBKEY }}
        run: |
          for v in TRAPD_HOSTED_BACKEND_URL TRAPD_HOSTED_CA_PEM TRAPD_HOSTED_COMMAND_PUBKEY TRAPD_HOSTED_RELEASE_PUBKEY; do
            if [ -z "${!v}" ]; then
              echo "::notice::Debian package skipped (repository variable ${v} not set)"
              echo "built=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          mkdir trust
          printf '%s\n' "${TRAPD_HOSTED_BACKEND_URL}" > trust/backend_url
          printf '%s\n' "${TRAPD_HOSTED_CA_PEM}" > trust/ca.crt
          printf '%s' "${TRAPD_HOSTED_COMMAND_PUBKEY}" | base64 -d > trust/command_signing.pub
          printf '%s' "${TRAPD_HOSTED_RELEASE_PUBKEY}" | base64 -d > trust/release_signing.pub
          # build-deb.sh fails on malformed anchors (key sizes, private keys, URL).
          deploy/deb/build-deb.sh "${GITHUB_REF_NAME#v}" trapd-agent-linux-x86_64 trapd-agent-exec trust deb-out
          deb_files=(deb-out/*.deb)
          [ "${#deb_files[@]}" -eq 1 ] || { echo "::error::expected exactly one .deb in deb-out"; exit 1; }
          cp "${deb_files[0]}" trapd-agent-linux-amd64.deb
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Generate SHA256 checksums
        run: |
          # Per-artifact checksum files consumed by install.sh / trapd-update,
          # plus an aggregate SHA256SUMS for manual `sha256sum --check`. The
          # SBOMs are covered too so their integrity can be verified alongside
          # the binaries.
          sha256sum trapd-agent-linux-x86_64       > trapd-agent-linux-x86_64.sha256
          sha256sum trapd-agent-windows-x86_64.exe > trapd-agent-windows-x86_64.exe.sha256
          sha256sum trapd-agent-windows-x86_64.msi > trapd-agent-windows-x86_64.msi.sha256
          sha256sum trapd-agent-exec               > trapd-agent-exec.sha256
          sha256sum trapd-update.sh                > trapd-update.sh.sha256
          sha256sum trapd-agent-windows-install.ps1 > trapd-agent-windows-install.ps1.sha256
          extra=()
          if [ "${{ steps.deb.outputs.built }}" = "true" ]; then
            sha256sum trapd-agent-linux-amd64.deb > trapd-agent-linux-amd64.deb.sha256
            extra+=(trapd-agent-linux-amd64.deb)
          fi
          sha256sum \
            trapd-agent-linux-x86_64 \
            trapd-agent-windows-x86_64.exe \
            trapd-agent-windows-x86_64.msi \
            trapd-agent-exec \
            trapd-update.sh \
            trapd-agent-windows-install.ps1 \
            "${extra[@]}" \
            sbom-trapd-agent.cdx.json \
            sbom-trapd-agent-ebpf.cdx.json > SHA256SUMS
          cat SHA256SUMS

      - name: Sign release statements (self-update)
        # One signed statement per updatable artifact: version, platform, URL,
        # SHA-256 and size, signed with the offline release key. Agents refuse an
        # update unless this signature verifies against the key provisioned on the
        # host, so GitHub (or anyone with write access to it) cannot push code to
        # the fleet. The key only ever lives in this secret.
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          # Optional independent key matching /etc/trapd/signing.pub. Signs the
          # raw binary digest; the signature is embedded in the release payload.
          BINARY_SIGNING_KEY: ${{ secrets.BINARY_SIGNING_KEY }}
        run: |
          if [ -z "${RELEASE_SIGNING_KEY}" ]; then
            echo "::warning::RELEASE_SIGNING_KEY not set - release is NOT signed and will not be offered for self-update"
            : > release-statements.ndjson
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          : > release-statements.ndjson
          # Linux: the eBPF object is version-coupled to the binary, so it is
          # covered by the same signature and installed together with it.
          cargo run --release -q -p xtask -- sign-release \
            --version "${version}" --os linux --arch x86_64 \
            --tag "${GITHUB_REF_NAME}" \
            --asset-name trapd-agent-linux-x86_64 --file trapd-agent-linux-x86_64 \
            --ebpf-asset-name trapd-agent-exec --ebpf-file trapd-agent-exec \
            >> release-statements.ndjson
          cargo run --release -q -p xtask -- sign-release \
            --version "${version}" --os windows --arch x86_64 \
            --tag "${GITHUB_REF_NAME}" \
            --asset-name trapd-agent-windows-x86_64.exe --file trapd-agent-windows-x86_64.exe \
            >> release-statements.ndjson
          wc -l release-statements.ndjson

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            trapd-agent-linux-x86_64
            trapd-agent-linux-x86_64.sha256
            trapd-agent-windows-x86_64.exe
            trapd-agent-windows-x86_64.exe.sha256
            trapd-agent-windows-x86_64.msi
            trapd-agent-windows-x86_64.msi.sha256
            trapd-agent-exec
            trapd-agent-exec.sha256
            trapd-agent-linux-amd64.deb
            trapd-agent-linux-amd64.deb.sha256
            trapd-update.sh
            trapd-update.sh.sha256
            trapd-agent-windows-install.ps1
            trapd-agent-windows-install.ps1.sha256
            sbom-trapd-agent.cdx.json
            sbom-trapd-agent-ebpf.cdx.json
            SHA256SUMS
            release-statements.ndjson
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Register signed releases with the backend
        # Registration never ships anything: the backend creates each release
        # paused at 0 % and re-verifies the signature against its pinned key. An
        # operator opts in to the rollout separately. Skipped when not configured.
        env:
          TRAPD_BACKEND_URL: ${{ secrets.TRAPD_BACKEND_URL }}
          TRAPD_RELEASE_PUBLISH_TOKEN: ${{ secrets.TRAPD_RELEASE_PUBLISH_TOKEN }}
          CHANNEL: ${{ contains(github.ref_name, '-') && 'beta' || 'stable' }}
        run: |
          if [ -z "${TRAPD_BACKEND_URL}" ] || [ -z "${TRAPD_RELEASE_PUBLISH_TOKEN}" ] || [ ! -s release-statements.ndjson ]; then
            echo "::notice::backend registration skipped (not configured or nothing signed)"
            exit 0
          fi
          while read -r line; do
            body="$(printf '%s' "${line}" | jq -c --arg channel "${CHANNEL}" '. + {channel: $channel}')"
            curl -fsS -X POST "${TRAPD_BACKEND_URL%/}/api/v1/agent-releases" \
              -H "Authorization: Bearer ${TRAPD_RELEASE_PUBLISH_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "${body}"
            echo
          done < release-statements.ndjson
