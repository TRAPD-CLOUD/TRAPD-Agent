# Example Sigma rules for the TRAPD agent's local detection engine.
# Install to <config>/sigma/ (default /etc/trapd/sigma/). Rules are also
# deliverable inline over the signed config channel (AgentConfig.sigma_rules).
# Supported logsource categories: process_creation, network_connection,
# dns_query, file_event, driver_load.
---
title: Bash Reverse Shell via /dev/tcp
id: a1f4c2e0-0001-4a10-9c00-000000000001
status: stable
level: high
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    Image|endswith:
      - '/bash'
      - '/sh'
    CommandLine|contains: '/dev/tcp/'
  condition: selection
tags:
  - attack.execution
  - attack.t1059.004
---
title: Netcat Reverse Shell Execution
id: a1f4c2e0-0002-4a10-9c00-000000000002
status: stable
level: high
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    CommandLine|re: 'nc(\.traditional)?\s+.*-e\s+/(bin|usr/bin)/(ba)?sh'
  condition: selection
tags:
  - attack.execution
  - attack.t1059.004
---
title: Curl/Wget Pipe To Shell (Download Cradle)
id: a1f4c2e0-0003-4a10-9c00-000000000003
status: experimental
level: medium
logsource:
  product: linux
  category: process_creation
detection:
  download:
    CommandLine|contains:
      - 'curl '
      - 'wget '
  pipe_to_shell:
    CommandLine|contains:
      - '| sh'
      - '| bash'
      - '|sh'
      - '|bash'
  condition: download and pipe_to_shell
tags:
  - attack.execution
  - attack.t1059.004
---
title: Read Of /etc/shadow By Non-Service Process
id: a1f4c2e0-0004-4a10-9c00-000000000004
status: experimental
level: high
logsource:
  product: linux
  category: file_event
detection:
  selection:
    TargetFilename: '/etc/shadow'
  condition: selection
tags:
  - attack.credential_access
  - attack.t1003.008
---
title: Outbound Connection To Cloud Metadata IMDS
id: a1f4c2e0-0005-4a10-9c00-000000000005
status: stable
level: medium
logsource:
  product: linux
  category: network_connection
detection:
  selection:
    DestinationIp: '169.254.169.254'
  condition: selection
tags:
  - attack.credential_access
  - attack.t1552.005
