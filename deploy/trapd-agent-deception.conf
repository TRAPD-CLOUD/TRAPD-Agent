# Opt-in: lets the agent plant honeytoken decoys on this host.
#
# The default unit keeps /home, /root and the rest of the file system read-only
# for the agent, so a decoy in ~/.aws, ~/.ssh, /root or /srv fails with EROFS.
# Enabling this drop-in lifts exactly that, on this host only:
#   - ProtectHome=false / ProtectSystem=full: /home, /root, /srv and /opt become
#     writable. /usr, /boot and /etc stay read-only (decoys in /etc are not
#     supported).
#   - CAP_DAC_OVERRIDE: write into directories the agent's uid cannot otherwise
#     write to (decoys in other users' home directories).
#   - CAP_CHOWN / CAP_FOWNER: give a decoy the owner and timestamps of its
#     neighbour so it does not stand out.
# Only enable it when honeytoken paths are configured for this device.
#
# Enable:  install -D -m 0644 <this file> \
#            /etc/systemd/system/trapd-agent.service.d/deception.conf
#          systemctl daemon-reload && systemctl restart trapd-agent
# Disable: rm /etc/systemd/system/trapd-agent.service.d/deception.conf
#          systemctl daemon-reload && systemctl restart trapd-agent
[Service]
ProtectSystem=full
ProtectHome=false
# Merged with the base unit's CapabilityBoundingSet.
CapabilityBoundingSet=CAP_DAC_OVERRIDE CAP_CHOWN CAP_FOWNER
