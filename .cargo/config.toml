[alias]
# `cargo xtask <subcommand>` runs the workspace's xtask binary so the
# release workflow can invoke `cargo xtask build-ebpf --release` without
# spelling out `cargo run --package xtask -- build-ebpf --release`.
xtask = "run --package xtask --"

# The MSI needs no separate Visual C++ runtime installation.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
