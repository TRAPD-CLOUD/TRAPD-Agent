[package]
name = "trapd-detection"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
[dependencies]
trapd-schema = { path = "../trapd-schema" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
tracing = "0.1"
globset = "0.4"
regex = "1.12.3"
serde_yaml_ng = "0.10"
sha2 = "0.10"
hex = "0.4"
# `vendored` + `bundled-4_5_1` compile libyara 4.5.1 from the crate's own
# sources with pre-generated bindings: no system libyara, headers or libclang
# at build time. `module-hash` links OpenSSL's libcrypto.
yara-rust = { version = "0.28", package = "yara", optional = true, default-features = false, features = [
    "vendored",
    "bundled-4_5_1",
    "ndebug",
    "module-hash",
    "module-dotnet",
    "module-dex",
    "module-macho",
] }
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
[features]
yara = ["dep:yara-rust"]
