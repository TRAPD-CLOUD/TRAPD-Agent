# Example Sigma rules for the TRAPD agent's local detection engine.
# Install to <config>/sigma/ (default /etc/trapd/sigma/). Rules are also
# deliverable inline over the signed config channel (AgentConfig.sigma_rules).
# Supported logsource categories: process_creation, network_connection,
# dns_query, file_event, driver_load.
#
# These complement the native rules; they must not re-detect what a native
# rule already reports (bash /dev/tcp, curl|sh, /etc/shadow, IMDS, …), or one
# action becomes two findings. `cargo test sigma_examples` enforces that.
---
title: Netcat Reverse Shell Execution
id: a1f4c2e0-0002-4a10-9c00-000000000002
status: stable
level: high
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    CommandLine|re: 'nc(\.traditional|at)?\s+.*-e\s+/(bin|usr/bin)/(ba)?sh'
  condition: selection
tags:
  - attack.execution
  - attack.t1059.004
---
title: Socat Reverse Shell
id: a1f4c2e0-0006-4a10-9c00-000000000006
status: experimental
level: high
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    Image|endswith: '/socat'
    CommandLine|contains:
      - 'exec:'
      - 'EXEC:'
      - 'system:'
  network:
    CommandLine|contains: 'tcp'
  condition: selection and network
tags:
  - attack.execution
  - attack.t1059.004
---
title: Named Pipe Reverse Shell (mkfifo)
id: a1f4c2e0-0007-4a10-9c00-000000000007
status: experimental
level: high
logsource:
  product: linux
  category: process_creation
detection:
  fifo:
    CommandLine|contains:
      - 'mkfifo'
      - 'mknod'
  shell:
    CommandLine|contains:
      - '/bin/sh'
      - '/bin/bash'
  netcat:
    CommandLine|contains:
      - 'nc '
      - 'ncat '
  condition: fifo and shell and netcat
tags:
  - attack.execution
  - attack.t1059.004
