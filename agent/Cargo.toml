[package]
license = "Apache-2.0"
name    = "trapd-agent"
version = "0.7.2"
edition = "2021"

[[bin]]
name = "trapd-agent"
path = "src/main.rs"

[dependencies]
regex = "1.12.3"
trapd-schema = { path = "../crates/trapd-schema" }
trapd-detection = { path = "../crates/trapd-detection" }
tokio              = { version = "1",    features = ["full"] }
serde              = { version = "1",    features = ["derive"] }
serde_json         = "1"
anyhow             = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait        = "0.1"
uuid               = { version = "1",   features = ["v4", "serde"] }
chrono             = { version = "0.4", features = ["serde"] }
hostname           = "0.4"
sysinfo            = "0.30"
reqwest            = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite           = { version = "0.37", features = ["bundled"] }
sha2               = "0.10"
md-5               = "0.10"
hex                = "0.4"
walkdir            = "2"
ed25519-dalek      = { version = "2", features = ["pkcs8", "pem"] }
base64             = "0.22"
# gzip request bodies (transport). Pure Rust (miniz_oxide): no C toolchain needed
# for the Windows cross build, unlike zstd bindings.
flate2             = "1"
globset            = "0.4"
ipnet              = { version = "2", features = ["serde"] }
getrandom          = "0.3"
zeroize            = { version = "1", features = ["derive"] }

[features]
yara = ["trapd-detection/yara"]

# eBPF userspace loader — Linux only.
# Only needed at runtime if the eBPF binary is installed;
# compiles cleanly on all platforms.
[target.'cfg(target_os = "linux")'.dependencies]
aya = { version = "0.13", features = ["async_tokio"] }
nix = { version = "0.29", default-features = false, features = ["signal", "process", "fs", "user", "net"] }
libc = "0.2"
procfs  = "0.17"
inotify = "0.10"

# Windows agent dependencies (Windows only):
#  - filesystem honeytoken monitoring (ReadDirectoryChangesW via `notify`)
#  - registry access (agent settings, legacy registry decoy cleanup) via windows-sys
#  - service integration (register/run/stop under the SCM via windows-service)
[target.'cfg(windows)'.dependencies]
notify      = "8"
# windows-sys exposes C APIs but not typed COM interfaces. Use Microsoft's
# owning bindings for INetFwPolicy2/INetFwRule instead of handwritten vtables.
windows = { version = "0.62", features = [
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_EventLog",
    "Win32_System_RemoteDesktop",
    "Win32_System_Diagnostics_Etw",
    "Win32_Storage_FileSystem",
    "Win32_System_Time",
    "Win32_Security_Authorization",
    "Win32_Security_WinTrust",
    "Win32_Security_Cryptography",
    "Win32_Security_Authentication_Identity",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_WindowsProgramming",
    "Win32_System_Diagnostics_ToolHelp",
    "Wdk",
    "Wdk_System",
    "Wdk_System_Threading",
] }
roxmltree = "0.20"
windows-service = "0.7"
